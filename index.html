<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Claude Desktopを起動</title>
<style>
  body {
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background: #faf9f7;
    color: #3d3d3a;
  }
  .card {
    text-align: center;
    padding: 40px;
  }
  a.button {
    display: inline-block;
    margin-top: 16px;
    padding: 10px 24px;
    background: #d97757;
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    font-size: 16px;
  }
</style>
</head>
<body>
  <div class="card">
    <p>Claude Desktopを起動しています...</p>
    <p>自動で起動しない場合は下のボタンをクリックしてください。</p>
    <a class="button" href="claude://claude.ai/new">Claudeを開く</a>
  </div>
  <script>
    // 自動リダイレクト
    window.location.href = "claude://claude.ai/new";
  </script>
</body>
</html>
