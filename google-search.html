<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Google検索</title>
<style>
  body {
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background: #faf9f7;
  }
  form {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 90%;
    max-width: 480px;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 16px;
    font-size: 16px;
    border: 1px solid #d9d5cd;
    border-radius: 24px;
    outline: none;
  }
  input[type="text"]:focus {
    border-color: #d97757;
  }
  button {
    padding: 12px 20px;
    font-size: 14px;
    border: none;
    border-radius: 24px;
    background: #d97757;
    color: #fff;
    cursor: pointer;
  }
  button:hover {
    background: #c9663f;
  }
</style>
</head>
<body>
  <form id="searchForm" action="https://www.google.com/search" method="GET" target="_blank">
    <input type="text" name="q" id="q" placeholder="Googleで検索..." autofocus autocomplete="off">
    <button type="submit">検索</button>
  </form>
  <script>
    // Enterキーでも新しいタブで検索(target="_blank"がform自体に効くので基本これで動作)
    document.getElementById('searchForm').addEventListener('submit', function(e) {
      var query = document.getElementById('q').value.trim();
      if (!query) {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
